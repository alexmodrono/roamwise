    price_total: 292
    rating: 4,94/5 · 392 reseñas · Favorito entre huéspedes · Superhost
    url: "https://www.airbnb.com/rooms/24703715?adults=2&check_in=2026-11-13&check_out=2026-11-16"
    image: /stays/balerno-suite-1.jpg
    images:
      - /stays/balerno-suite-2.jpg
      - /stays/balerno-suite-3.jpg
    notes: >-
      Precio total mostrado para dos personas y las tres noches del 13 al 16 de noviembre,
      consultado el 5 de septiembre de 2026. Suite independiente sin espacios interiores
      compartidos: salón-cocina, dormitorio doble y cuarto de ducha. La parada está a unos
      3 minutos andando y el autobús 44 tarda aproximadamente 45 minutos hasta el centro.
      Número de registro indicado por el anuncio: EH-76969-F. Transporte: el 44 es una línea
      urbana de Lothian Buses, así que se paga la tarifa plana de 2,40 £ por trayecto, el
      TapTapCap tope de 5,70 £ al día y el Ridacard semanal (23 £ estudiante con carné de una
      universidad de Edimburgo, 26,50 £ adulto) lo cubren sin recargo de zona; también cubren
      el N44 nocturno. Según el horario vigente, el último 44 desde West End sale a las 23:54
      todos los días (llega a Balerno a las 00:30), de día pasa cada 10–15 min entre semana y
      sábados y cada 20 min los domingos, y el primer bus desde Balerno sale antes de las 05:30.
      Las coordenadas son la ubicación aproximada que publica Airbnb (radio de unos 150 m),
      dentro de Balerno, City of Edinburgh; no es Glasgow ni ninguna otra ciudad.
    amenities: [Alojamiento completo, Entrada privada, Cocina equipada, Horno, Placa de inducción, Microondas, Wifi, Televisión]
    pros: [Ahorro muy importante, Privacidad total, Valoración excelente, Cocina completa, Cancelación gratuita, Una sola estancia para las tres noches]
